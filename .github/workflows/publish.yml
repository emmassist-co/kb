name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify:public-packages
      - run: npm run verify:kb:evals
      - run: npm run typecheck
      - run: npm publish --workspace @emmassist-co/kb-core --workspace @emmassist-co/kb-storage-file --workspace @emmassist-co/kb-storage-cloudflare --workspace @emmassist-co/kb-http --workspace @emmassist-co/kb-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
