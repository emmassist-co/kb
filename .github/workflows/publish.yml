name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GBRAIN_EVALS_REPO: ${{ github.workspace }}/gbrain-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: garrytan/gbrain-evals
          path: gbrain-evals
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run verify:public-packages
      - run: npm run verify:kb:evals
      - run: npm run typecheck
      - run: node scripts/publish-public-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
