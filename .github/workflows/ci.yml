name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GBRAIN_EVALS_REPO: ${{ github.workspace }}/gbrain-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: garrytan/gbrain-evals
          path: gbrain-evals
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
      - name: Build staged public packages
        run: npm run build:public
      - name: Verify staged public package artifacts
        run: npm run verify:public-packages
      - name: Run typecheck
        run: npm run typecheck
      - name: Run KB anti-cheat guardrails
        run: npm run check:kb:anti-cheat
      - name: Run npm test shard for kb-http and kb-cli
        run: ./node_modules/.bin/tsx --test tests/kb-cli.test.ts tests/kb-http.test.ts
      - name: Run KB eval policy verification
        run: npm run verify:kb:evals
      - name: Run kb smoke verification
        run: ./node_modules/.bin/tsx scripts/kb-verify.ts --mode all
      - name: Run KB agent readiness smoke
        run: npm run smoke:kb-agent-readiness -- --local-pack --skip-build
